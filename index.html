<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Esto No Es Una Revista</title>
    <style>
        /* Pantalla de carga limpia mientras se procesa la redirección */
        body { 
            background-color: #000000; 
            margin: 0; 
            padding: 0; 
        }
    </style>
    <script>
        // REGLA DE REDIRECCIÓN INTELIGENTE
        document.addEventListener("DOMContentLoaded", () => {
            // Configura aquí el número de edición al que querés enviar al lector:
            const EDICION_VIGENTE = 1; 

            // Formateamos el número para que siempre tenga dos dígitos (ej: 1 -> 01, 12 -> 12)
            const numeroFormateado = String(EDICION_VIGENTE).padStart(2, '0');

            // Armamos la ruta física hacia la carpeta de esa edición
            const urlDestino = `revista${numeroFormateado}/index.html`;

            // Ejecutamos la redirección inmediata saltando el historial del navegador
            window.location.replace(urlDestino);
        });
    </script>
</head>
<body>
</body>
</html>
