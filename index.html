<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Esto No Es Una Revista</title>

    <link rel="stylesheet" href="estilos.css">
    
</head>


<body class="portada-inicial">


    <img
        id="portada"
        alt="Esto No Es Una Revista"
    >

    <div id="poemaIndex"></div>


    <script>

        // ============================================================
        // CONFIGURACIÓN
        // ============================================================

        const EDICION_VIGENTE = 28;


        // ============================================================
        // VARIABLES
        // ============================================================

        const numFormateado =
            String(EDICION_VIGENTE)
                .padStart(2, '0');


        let urlDestino = "";
        let urlPortada = "";
        let UrlIndex = "";


        // ============================================================
        // EDICIONES 1 A 10
        // ============================================================

        if (
            EDICION_VIGENTE >= 1 &&
            EDICION_VIGENTE <= 10
        ) {

            const directorio =
                `/eneur-01-10/revista${numFormateado}`;

            urlDestino =
                `${directorio}/index.html`;

            urlPortada =
                `${directorio}/portada.jpg`;

        }


        // ============================================================
        // EDICIONES 11 A 20
        // ============================================================

        else if (
            EDICION_VIGENTE >= 11 &&
            EDICION_VIGENTE <= 20
        ) {

            const directorio =
                `/eneur-11-20/revista${numFormateado}`;

            urlDestino =
                `${directorio}/index.html`;

            urlPortada =
                `${directorio}/portada.jpg`;

        }


        // ============================================================
        // EDICIONES 21 A 26
        // ============================================================

        else if (
            EDICION_VIGENTE >= 21 &&
            EDICION_VIGENTE <= 26
        ) {

            const directorio =
                `/eneur-21-26/revista${numFormateado}`;

            urlDestino =
                `${directorio}/index.html`;

            urlPortada =
                `${directorio}/portada.jpg`;

        }


        // ============================================================
        // EDICIONES 27 EN ADELANTE
        // ============================================================

        else {
            if (
                EDICION_VIGENTE >= 27 &&
                EDICION_VIGENTE <= 40
            ){
                urlPortada = `/eneur-27-40/revista${numFormateado}/images/portada.jpg`;
                UrlIndex = `/eneur-27-40/revista${numFormateado}/content/index.php`;
            }
            else if (
                EDICION_VIGENTE >= 41 &&
                EDICION_VIGENTE <= 50
            ){
                urlPortada = `/eneur-41-50/revista${numFormateado}/portada.jpg`;
                UrlIndex = `/eneur-41-50/revista${numFormateado}/content/index.php`;
            }
            else if (
                EDICION_VIGENTE >= 51 &&
                EDICION_VIGENTE <= 60
            ){
                urlPortada = `/eneur-51-60/revista${numFormateado}/portada.jpg`;
                UrlIndex = `/eneur-51-60/revista${numFormateado}/content/index.php`;
            }
            else if (
                EDICION_VIGENTE >= 61 &&
                EDICION_VIGENTE <= 70
            ){
                urlPortada = `/eneur-61-70/revista${numFormateado}/portada.jpg`;
                UrlIndex = `/eneur-61-70/revista${numFormateado}/content/index.php`;
            }
            else if (
                EDICION_VIGENTE >= 71 &&
                EDICION_VIGENTE <= 80
            ){
                urlPortada = `/eneur-71-80/revista${numFormateado}/portada.jpg`;
                UrlIndex = `/eneur-71-80/revista${numFormateado}/content/index.php`;
            }
            else if (
                EDICION_VIGENTE >= 81 &&
                EDICION_VIGENTE <= 90
            ){
                urlPortada = `/eneur-81-90/revista${numFormateado}/portada.jpg`;
                UrlIndex = `/eneur-81-90/revista${numFormateado}/content/index.php`;
            }
            else if (
                EDICION_VIGENTE >= 91 &&
                EDICION_VIGENTE <= 100
            ){
                urlPortada = `/eneur-91-00/revista${numFormateado}/portada.jpg`;
                UrlIndex = `/eneur-91-00/revista${numFormateado}/content/index.php`;
            }

            urlDestino =
                `/indice.html?num=${EDICION_VIGENTE}`;

        }


        // ============================================================
        // ELEMENTO PORTADA
        // ============================================================

        const portada =
            document.getElementById('portada');


        portada.src =
            urlPortada;


        // ============================================================
        // MOSTRAR PORTADA
        // ============================================================

        /*
         * Esperamos un instante para permitir que
         * el navegador renderice el estado opacity: 0
         * antes de comenzar el fade in.
         */

        portada.addEventListener(
            'load',
            () => {

                requestAnimationFrame(() => {

                    portada.classList.add(
                        'visible'
                    );

                });

            }
        );

        
         // ============================================================
        // POEMA INDEX
        // ============================================================

      
        async function cargarPoema() {

            console.log('URL poema: ' + UrlIndex);
            
            const respuesta = await fetch(UrlIndex);
            const html = await respuesta.text();
        
            const parser = new DOMParser();
            const documento = parser.parseFromString(html, 'text/html');
        
            const poema = documento.getElementById('poemaIndex');
        
            if (poema) {
                document.getElementById('poemaIndex').innerHTML = poema.innerHTML;
            }
        }

        cargarPoema();
        
        // ============================================================
        // REDIRECCIÓN CON FADE OUT
        // ============================================================

        let redireccionando = false;


        function irAlIndice() {

            /*
             * Evita que un click y el timeout
             * disparen dos redirecciones.
             */

            if (redireccionando) {
                return;
            }


            redireccionando = true;


            /*
             * Comenzar fade out
             */

            portada.classList.remove(
                'visible'
            );


            portada.classList.add(
                'saliendo'
            );


            /*
             * Esperar a que termine
             * la transición CSS.
             */

            setTimeout(
                () => {

                    window.location.replace(
                        urlDestino
                    );

                },
                1000
            );

        }


        // ============================================================
        // CLICK EN LA PORTADA
        // ============================================================

        portada.addEventListener(
            'click',
            irAlIndice
        );


        // ============================================================
        // REDIRECCIÓN AUTOMÁTICA
        // ============================================================

        setTimeout(
            irAlIndice,
            30000
        );

    </script>


</body>

</html>
