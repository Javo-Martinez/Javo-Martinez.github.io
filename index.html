<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Esto No Es Una Revista</title>


    <style>

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
        }


        body {
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }


        #portada {
            display: block;

            max-width: 100%;
            max-height: 100vh;

            width: auto;
            height: auto;

            cursor: pointer;

            /*
             * Estado inicial:
             * invisible
             */
            opacity: 0;

            /*
             * Fade in / fade out
             */
            transition: opacity 1s ease;
        }


        /*
         * Estado visible
         */
        #portada.visible {
            opacity: 1;
        }


        /*
         * Estado de salida
         */
        #portada.saliendo {
            opacity: 0;
        }

    </style>

</head>


<body>


    <img
        id="portada"
        alt="Esto No Es Una Revista"
    >


    <script>

        // ============================================================
        // CONFIGURACIÓN
        // ============================================================

        const EDICION_VIGENTE = 28;


        // ============================================================
        // VARIABLES
        // ============================================================

        const numFormateado =
            String(EDICION_VIGENTE)
                .padStart(2, '0');


        let urlDestino = "";
        let urlPortada = "";


        // ============================================================
        // EDICIONES 1 A 10
        // ============================================================

        if (
            EDICION_VIGENTE >= 1 &&
            EDICION_VIGENTE <= 10
        ) {

            const directorio =
                `/eneur-01-10/revista${numFormateado}`;

            urlDestino =
                `${directorio}/index.html`;

            urlPortada =
                `${directorio}/portada.jpg`;

        }


        // ============================================================
        // EDICIONES 11 A 20
        // ============================================================

        else if (
            EDICION_VIGENTE >= 11 &&
            EDICION_VIGENTE <= 20
        ) {

            const directorio =
                `/eneur-11-20/revista${numFormateado}`;

            urlDestino =
                `${directorio}/index.html`;

            urlPortada =
                `${directorio}/portada.jpg`;

        }


        // ============================================================
        // EDICIONES 21 A 26
        // ============================================================

        else if (
            EDICION_VIGENTE >= 21 &&
            EDICION_VIGENTE <= 26
        ) {

            const directorio =
                `/eneur-21-26/revista${numFormateado}`;

            urlDestino =
                `${directorio}/index.html`;

            urlPortada =
                `${directorio}/portada.jpg`;

        }


        // ============================================================
        // EDICIONES 27 EN ADELANTE
        // ============================================================

        else {

            urlDestino =
                `/indice.html?num=${EDICION_VIGENTE}`;

            urlPortada =
                `/ediciones/${EDICION_VIGENTE}/portada.jpg`;

        }


        // ============================================================
        // ELEMENTO PORTADA
        // ============================================================

        const portada =
            document.getElementById('portada');


        portada.src =
            urlPortada;


        // ============================================================
        // MOSTRAR PORTADA
        // ============================================================

        /*
         * Esperamos un instante para permitir que
         * el navegador renderice el estado opacity: 0
         * antes de comenzar el fade in.
         */

        portada.addEventListener(
            'load',
            () => {

                requestAnimationFrame(() => {

                    portada.classList.add(
                        'visible'
                    );

                });

            }
        );


        // ============================================================
        // REDIRECCIÓN CON FADE OUT
        // ============================================================

        let redireccionando = false;


        function irAlIndice() {

            /*
             * Evita que un click y el timeout
             * disparen dos redirecciones.
             */

            if (redireccionando) {
                return;
            }


            redireccionando = true;


            /*
             * Comenzar fade out
             */

            portada.classList.remove(
                'visible'
            );


            portada.classList.add(
                'saliendo'
            );


            /*
             * Esperar a que termine
             * la transición CSS.
             */

            setTimeout(
                () => {

                    window.location.replace(
                        urlDestino
                    );

                },
                1000
            );

        }


        // ============================================================
        // CLICK EN LA PORTADA
        // ============================================================

        portada.addEventListener(
            'click',
            irAlIndice
        );


        // ============================================================
        // REDIRECCIÓN AUTOMÁTICA
        // ============================================================

        setTimeout(
            irAlIndice,
            30000
        );

    </script>


</body>

</html>
