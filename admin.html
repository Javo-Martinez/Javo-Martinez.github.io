<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Revista Digital</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; background: #f5f7fb; color: #333; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        h2 { margin-top: 0; color: #1a202c; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 14px; color: #4a5568; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        textarea { height: 100px; font-family: inherit; }
        .btn { background: #3182ce; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 20px; display: inline-block; }
        .btn:hover { background: #2b6cb0; }
        .btn-sec { background: #edf2f7; color: #4a5568; margin-right: 10px; }
        .btn-sec:hover { background: #e2e8f0; }
        .nota-block { background: #f7fafc; padding: 20px; border-left: 4px solid #3182ce; margin-top: 15px; border-radius: 0 8px 8px 0; }
        .flex { display: flex; gap: 15px; }
        .status { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; font-weight: 500; }
        .success { background: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
        .error { background: #fed7d7; color: #742a2a; border: 1px solid #feb2b2; }
    </style>
</head>
<body>

    <h1>🚀 Lanzar Nuevo Número</h1>
    
    <div class="card">
        <h2>1. Conexión con GitHub</h2>
        <div class="flex">
            <div style="flex:1;">
                <label>Usuario de GitHub:</label>
                <input type="text" id="gh-user" placeholder="ej: mi-usuario">
            </div>
            <div style="flex:1;">
                <label>Nombre del Repositorio:</label>
                <input type="text" id="gh-repo" placeholder="ej: revista-digital">
            </div>
        </div>
        <label>Personal Access Token (Token Secreto):</label>
        <input type="password" id="gh-token" placeholder="github_pat_...">
    </div>

    <form id="revista-form">
        <div class="card">
            <h2>2. Datos de la Edición</h2>
            <div class="flex">
                <div style="flex:1;">
                    <label>Número de Edición (ID numérico):</label>
                    <input type="number" id="id-numero" value="1" required>
                </div>
                <div style="flex:2;">
                    <label>Título del Número:</label>
                    <input type="text" id="titulo-numero" placeholder="ej: Edición Especial Nro 1" required>
                </div>
            </div>
            <div class="flex">
                <div style="flex:1;">
                    <label>Fecha de Publicación:</label>
                    <input type="date" id="fecha-pub" required>
                </div>
                <div style="flex:2;">
                    <label>Ruta Imagen de Tapa:</label>
                    <input type="text" id="img-tapa" placeholder="ej: /imagenes/edicion1/tapa.jpg" required>
                </div>
            </div>
            <label>Texto o Poema de Portada:</label>
            <textarea id="poema-portada" placeholder="Escribe las líneas de poesía..."></textarea>
            <label>Copy / Bajada de Portada:</label>
            <input type="text" id="copy-portada" placeholder="Frase complementaria de la tapa">
            
            <label>Texto Editorial (Aparece en el índice general):</label>
            <textarea id="editorial-texto" placeholder="Escribe la nota editorial del número..." style="height:150px;"></textarea>
        </div>

        <div class="card">
            <h2>3. Contratapa</h2>
            <label>Título de Contratapa:</label>
            <input type="text" id="contra-titulo" value="Próximamente...">
            <label>Ruta Imagen Alusiva (Adelanto del próximo número):</label>
            <input type="text" id="contra-img" placeholder="ej: /imagenes/edicion1/adelanto.jpg">
        </div>

        <div class="card">
            <h2>4. Artículos / Notas del Número</h2>
            <div id="articulos-contenedor">
                <div class="nota-block" data-nota-index="1">
                    <h3>Nota #1</h3>
                    <div class="flex">
                        <div style="flex:2;">
                            <label>Título de la Nota:</label>
                            <input type="text" class="nota-titulo" required>
                        </div>
                        <div style="flex:1;">
                            <label>Sección (Dicta el CSS):</label>
                            <select class="nota-seccion">
                                <option value="Política">Política</option>
                                <option value="Cultura">Cultura</option>
                                <option value="Economía">Economía</option>
                                <option value="Sociedad">Sociedad</option>
                                <option value="Música">Música</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex">
                        <div style="flex:1;">
                            <label>Autor (Dejar vacío si es editorial):</label>
                            <input type="text" class="nota-autor">
                        </div>
                        <div style="flex:1;">
                            <label>Imagen Principal:</label>
                            <input type="text" class="nota-img" placeholder="ej: /imagenes/edicion1/nota1.jpg" required>
                        </div>
                    </div>
                    <label>Copete / Resumen breve:</label>
                    <input type="text" class="nota-copete" required>
                    <label>Frase corta (Juego con el título):</label>
                    <input type="text" class="nota-frase" required>
                    <label>Cuerpo de la nota (Soporta HTML, imágenes ancladas y iFrames):</label>
                    <textarea class="nota-cuerpo" placeholder="Escribe el texto en HTML..." style="height:180px;" required></textarea>
                </div>
            </div>
            <button type="button" class="btn btn-sec" onclick="agregarCamposNota()">➕ Agregar Otra Nota</button>
        </div>

        <button type="submit" class="btn" style="width:100%; background: #38a169;">🚀 Publicar Número en GitHub</button>
    </form>

    <div id="status-box" class="status"></div>

    <script>
        let contadorNotas = 1;
        document.getElementById('fecha-pub').value = new Date().toISOString().split('T')[0];

        function agregarCamposNota() {
            contadorNotas++;
            const contenedor = document.getElementById('articulos-contenedor');
            const nuevoBloque = document.createElement('div');
            nuevoBloque.className = 'nota-block';
            nuevoBloque.setAttribute('data-nota-index', contadorNotas);
            nuevoBloque.innerHTML = `
                <h3>Nota #${contadorNotas}</h3>
                <div class="flex">
                    <div style="flex:2;">
                        <label>Título de la Nota:</label>
                        <input type="text" class="nota-titulo" required>
                    </div>
                    <div style="flex:1;">
                        <label>Sección (Dicta el CSS):</label>
                        <select class="nota-seccion">
                            <option value="Política">Política</option>
                            <option value="Cultura">Cultura</option>
                            <option value="Economía">Economía</option>
                            <option value="Sociedad">Sociedad</option>
                            <option value="Música">Música</option>
                        </select>
                    </div>
                </div>
                <div class="flex">
                    <div style="flex:1;">
                        <label>Autor (Dejar vacío si es editorial):</label>
                        <input type="text" class="nota-autor">
                    </div>
                    <div style="flex:1;">
                        <label>Imagen Principal:</label>
                        <input type="text" class="nota-img" placeholder="ej: /imagenes/edicion1/nota\${contadorNotas}.jpg" required>
                    </div>
                </div>
                <label>Copete / Resumen breve:</label>
                <input type="text" class="nota-copete" required>
                <label>Frase corta (Juego con el título):</label>
                <input type="text" class="nota-frase" required>
                <label>Cuerpo de la nota (Soporta HTML e iFrames):</label>
                <textarea class="nota-cuerpo" style="height:180px;" required></textarea>
            `;
            contenedor.appendChild(nuevoBloque);
        }

        document.getElementById('revista-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusBox = document.getElementById('status-box');
            statusBox.style.display = 'block';
            statusBox.className = 'status'; 
            statusBox.innerText = '⏳ Conectando con la API de GitHub...';

            const user = document.getElementById('gh-user').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            const token = document.getElementById('gh-token').value.trim();
            const fileUrl = `https://github.com\${user}/\${repo}/contents/revista.json`;

            if(!user || !repo || !token) {statusBox.className = 'status error';statusBox.innerText = '❌ Completa las credenciales del bloque 1.';return;}const idNumero = parseInt(document.getElementById('id-numero').value);const articulos = [];const bloquesNotas = document.querySelectorAll('.nota-block');bloquesNotas.forEach((bloque, index) => {articulos.push({"id_article": (idNumero * 100) + (index + 1),"titulo": bloque.querySelector('.nota-titulo').value,"autor": bloque.querySelector('.nota-autor').value.trim(),"seccion": bloque.querySelector('.nota-seccion').value,"imagen_principal": bloque.querySelector('.nota-img').value,"copete": bloque.querySelector('.nota-copete').value,"frase_corta": bloque.querySelector('.nota-frase').value,"contenido_html": bloque.querySelector('.nota-cuerpo').value});});const nuevoIssue = {"id_numero": idNumero,"titulo_numero": document.getElementById('titulo-numero').value,"fecha_publicacion": document.getElementById('fecha-pub').value,"portada": {"imagen_tapa": document.getElementById('img-tapa').value,"texto_poema": document.getElementById('poema-portada').value,"copy_portada": document.getElementById('copy-portada').value},"editorial": document.getElementById('editorial-texto').value,"staff_colaboradores": [],"contratapa": {"titulo": document.getElementById('contra-titulo').value,"imagen_alusiva": document.getElementById('contra-img').value},"articulos": articulos};try {let currentJson = [];let sha = null;const getResponse = await fetch(fileUrl, {headers: { 'Authorization': token \${token} }});if (getResponse.ok) {const fileData = await getResponse.json();sha = fileData.sha;currentJson = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));}currentJson.unshift(nuevoIssue);const updatedContentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(currentJson, null, 2))));const putResponse = await fetch(fileUrl, {method: 'PUT',headers: {'Authorization': token \${token},'Content-Type': 'application/json'},body: JSON.stringify({message: Carga: Edicion Nro \${idNumero},content: updatedContentBase64,sha: sha})});if (putResponse.ok) {statusBox.className = 'status success';statusBox.innerText = 🎉 ¡Éxito! Guardado en GitHub.;} else {const errData = await putResponse.json();throw new Error(errData.message);}} catch (error) {statusBox.className = 'status error';statusBox.innerText = ❌ Error: \${error.message}.;}});
</script>
</body>
</html>
